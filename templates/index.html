<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>でたスロ | 全国パチスロ中古実機相場情報</title>

    <meta
        name="description"
        content="でたスロは全国のパチスロ中古実機相場を店舗ごとに掲載しています。店舗一覧から中古価格・価格推移をご確認いただけます。"
    >

    <style>
        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 28px 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 34px;
        }

        .subtitle {
            margin-top: 8px;
            color: #666;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
        }

        .shop-list {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(260px, 1fr)
                );
            gap: 18px;
        }

        .shop-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            transition: .2s;
        }

        .shop-card:hover {
            border-color: #0078ff;
            transform: translateY(-2px);
        }

        .shop-name {
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 60px;
            padding: 25px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>

    <h1>でたスロ</h1>

    <div class="subtitle">
        全国パチスロ中古実機相場情報
    </div>

</header>

<main>

    <h2>店舗一覧</h2>

    <div class="shop-list">

        {% for shop in SHOPS %}

        <a
            class="shop-card"
            href="{{ shop.directory }}/"
        >
            <div class="shop-name">
                {{ shop.name }}
            </div>
        </a>

        {% endfor %}

    </div>

</main>

<footer>

    © でたスロ

</footer>

</body>
</html>
