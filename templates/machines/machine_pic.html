<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ date }} 台番号 {{ machine_number }} 画像一覧</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 30px;
        }
        .image-list {
            display: block;
            margin: 0 auto;
        }
        .image-list div {
            margin-bottom: 20px;
        }
        .image-list img {
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .return-link {
            display: block;
            margin-top: 30px;
            font-size: 18px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h1>{{ date }} 台番号 {{ machine_number }} 画像一覧</h1>

    <div class="image-list">
        {% for img_url in image_urls %}
        <div>
            <img src="{{ img_url }}" alt="画像">
        </div>
        {% endfor %}
    </div>

    <a href="../index.html" class="return-link">← 一覧へ戻る</a>
</body>
</html>
